apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
  sources:
  - repoURL: https://github.com/jerryyf/home-ops.git
    targetRevision: main
    path: apps/immich
  - repoURL: ghcr.io/immich-app/immich-charts
    chart: immich
    targetRevision: 0.12.0
    helm:
      values: |
        immich:
          persistence:
            library:
              existingClaim: immich-pvc

        controllers:
          main:
            pod:
              nodeSelector:
                kubernetes.io/hostname: k3s-worker-1
            containers:
              main:
                image:
                  tag: v3.0.3
                env:
                  DB_HOSTNAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-pg-app
                        key: host
                  DB_USERNAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-pg-app
                        key: user
                  DB_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        name: immich-pg-app
                        key: password
                  DB_DATABASE_NAME:
                    valueFrom:
                      secretKeyRef:
                        name: immich-pg-app
                        key: dbname
                resources:
                  limits:
                    cpu: 400m
                    memory: 4Gi
                  requests:
                    cpu: 200m
                    memory: 1Gi

        valkey:
          enabled: true
