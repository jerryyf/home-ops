apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
  sources:
  - repoURL: https://github.com/jerryyf/home-ops.git
    targetRevision: main
    path: apps/jellyfin
  - repoURL: https://jellyfin.github.io/jellyfin-helm
    chart: jellyfin
    targetRevision: 3.2.0
    helm:
      values: |
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
            gpu.intel.com/i915: 1
        persistence:
          config:
            storageClass: jellyfin-sc
            size: 5Gi
          media:
            storageClass: jellyfin-sc
            size: 1Ti
            existingClaim: jellyfin-pvc
        securityContext:
          privileged: true
        volumes:
          - name: dri
            hostPath:
              path: /dev/dri
        volumeMounts:
          - name: dri
            mountPath: /dev/dri