apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-observability
  namespace: argocd
  annotations:
    # After platform-kiali-operator (wave 4), which installs the Kiali CRD.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
  source:
    repoURL: https://github.com/jerryyf/home-ops.git
    targetRevision: main
    path: apps/observability
