apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-agent-sandbox
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-sandbox-system
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
  source:
    repoURL: https://github.com/kubernetes-sigs/agent-sandbox.git
    targetRevision: v1.0.8
    path: k8s
    kustomize:
      images:
        - ko://sigs.k8s.io/agent-sandbox/cmd/agent-sandbox-controller=registry.k8s.io/agent-sandbox/agent-sandbox-controller:v1.0.8
