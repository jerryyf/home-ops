apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
  sources:
  - repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.19.0
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
  - repoURL: https://github.com/jerryyf/home-ops.git
    targetRevision: main
    path: apps/cert-manager