apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kiali-tls
  namespace: istio-system
spec:
  secretName: kiali-tls
  commonName: kiali.home.arpa
  dnsNames:
    - kiali.home.arpa
  duration: 168h
  renewBefore: 24h
  issuerRef:
    kind: ClusterIssuer
    name: home-ca-issuer

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: istio-system
spec:
  secretName: grafana-tls
  commonName: grafana.home.arpa
  dnsNames:
    - grafana.home.arpa
  duration: 168h
  renewBefore: 24h
  issuerRef:
    kind: ClusterIssuer
    name: home-ca-issuer
