apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: immich-tls
  namespace: istio-ingress
spec:
  secretName: immich-tls
  commonName: immich.home.arpa
  dnsNames:
    - immich.home.arpa
  duration: 168h
  renewBefore: 24h
  issuerRef:
    kind: ClusterIssuer
    name: home-ca-issuer
