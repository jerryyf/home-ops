apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: webhook-aws-env
  namespace: portfolio
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: 
    AWS_LAMBDA_FUNCTION_NAME: 
    AWS_REGION: 
    AWS_SECRET_ACCESS_KEY: 
  template:
    metadata:
      name: webhook-aws-env
      namespace: portfolio
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: webhook-telegram-env
  namespace: portfolio
spec:
  encryptedData:
    BOT_TOKEN: 
    CHAT_ID: 
  template:
    metadata:
      name: webhook-telegram-env
      namespace: portfolio
    type: Opaque