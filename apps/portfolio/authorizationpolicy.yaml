apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-cloudflared
  namespace: portfolio
spec:
  selector:
    matchLabels:
      app: portfolio
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/cloudflared/sa/default
      to:
        - operation:
            ports:
              - "3000"
